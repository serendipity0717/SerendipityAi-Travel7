<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SerendipityAI</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <header class="header header--transparent">
        <div class="header__logo">
            <a href="index.html">SerendipityAI</a>
        </div>
        <nav class="header__nav--desktop">
            <a href="map.html">Map</a>
            <a href="journal.html">Journal</a>
            <a href="itinerary.html">Itinerary</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="profile-card">
                <div class="profile-card__image">
                    <img src="assets/profile-placeholder.svg" alt="Profile Picture">
                </div>
                <div class="profile-card__info">
                    <input type="text" id="profileName" value="Alex Doe" class="profile-card__name">
                    <textarea id="profileBio" class="profile-card__bio">Travel enthusiast and photographer.</textarea>
                    <button id="saveProfile" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </div>
    </main>

    <nav class="nav--mobile">
        <a href="map.html" class="nav__link">
            <span class="material-icons">map</span>
            <span class="nav__text">Map</span>
        </a>
        <a href="journal.html" class="nav__link">
            <span class="material-icons">book</span>
            <span class="nav__text">Journal</span>
        </a>
        <a href="itinerary.html" class="nav__link">
            <span class="material-icons">list_alt</span>
            <span class="nav__text">Itinerary</span>
        </a>
        <a href="profile.html" class="nav__link">
            <span class="material-icons">person</span>
            <span class="nav__text">Profile</span>
        </a>
    </nav>

    <script src="js/main.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
